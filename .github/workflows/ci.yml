# SPDX-License-Identifier: GPL-3.0-only
#
# The checks of CONTRIBUTING.md on the reference platform. Both jobs run in a
# clean ubuntu:24.04 container, like a fresh install following the README: the
# hosted runner image also ships GCC 14, whose C runtime files clang 18 links
# instead of GCC 13's, so it cannot reproduce the recorded C binary
# (PROVENANCE.md). Nothing here starts a gNB, UE, core or radio: the demo and
# validators run the real brokers between local peers.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Reference environment (provenance, tests, demo, validators)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 40
    steps:
      - name: Install the reference C toolchain, libzmq and tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang-18 libzmq3-dev pkg-config make ca-certificates curl git
          clang-18 --version
          clang-18 -v 2>&1 | grep 'Selected GCC installation'
          pkg-config --modversion libzmq

      - uses: actions/checkout@v5

      - name: Trust the checkout for git (the container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.32/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create the pinned Python environment
        run: uv sync --frozen

      - name: Build the C broker
        run: make broker

      - name: Check source and build provenance (the rebuilt C binary must match)
        run: .venv/bin/python scripts/verify_provenance.py --require-reference-build

      - name: Run the offline test suite
        run: make test

      - name: Check the stepped-noise examples
        run: make verify-examples

      - name: Run the broker-only demo
        run: make demo

      - name: Run the actual-process validators
        run: make validate-local

      - name: Keep the validator evidence of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validator-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  python-3-12:
    name: Tests on the system Python 3.12 without uv
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 30
    steps:
      - name: Install the reference C toolchain, libzmq and Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang-18 libzmq3-dev pkg-config make ca-certificates git python3 python3-venv

      - uses: actions/checkout@v5

      - name: Create a virtual environment from the pyproject.toml pins
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install $(python3 -c 'import tomllib; p = tomllib.load(open("pyproject.toml", "rb")); print(*p["project"]["dependencies"], *p["dependency-groups"]["test"])')

      - name: Run the offline test suite
        run: make broker test
